name: Customer Churn MLOps Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  mlops-pipeline:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn mlflow joblib

      - name: Run automatic monitoring and retraining
        run: |
          python src/auto_retrain.py